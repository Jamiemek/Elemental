<script>
// the preview copy keeps its saves apart: on the same site as the real game, it would otherwise share them
(function () {
    var real = window.localStorage;
    var P = 'devcopy:';
    function keys() {
        var out = [];
        for (var i = 0; i < real.length; i++) {
            var k = real.key(i);
            if (k && k.indexOf(P) === 0) {
                out.push(k.slice(P.length));
            }
        }
        return out;
    }
    var api = {
        getItem: function (k) { return real.getItem(P + k); },
        setItem: function (k, v) { real.setItem(P + k, String(v)); },
        removeItem: function (k) { real.removeItem(P + k); },
        clear: function () { keys().forEach(function (k) { real.removeItem(P + k); }); },
        key: function (i) { var l = keys(); return i < l.length ? l[i] : null; }
    };
    var store = new Proxy(api, {
        get: function (t, k) {
            if (k === 'length') {
                return keys().length;
            }
            if (k in api) {
                return api[k];
            }
            var v = typeof k === 'string' ? real.getItem(P + k) : null;
            return v === null ? undefined : v;
        },
        ownKeys: function () { return keys(); },
        getOwnPropertyDescriptor: function (t, k) {
            var v = typeof k === 'string' ? real.getItem(P + k) : null;
            return v === null ? undefined : { enumerable: true, configurable: true, value: v };
        }
    });
    Object.defineProperty(window, 'localStorage', { configurable: true, get: function () { return store; } });
})();
</script>
